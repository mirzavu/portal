name: Deploy Production (Atomic)

# Deployment workflow
on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # --- BUILD PHASE ---
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portalweb/package-lock.json

      - name: Install Dependencies
        working-directory: portalweb
        run: npm ci

      - name: Build Next.js (Standalone)
        working-directory: portalweb
        env:
          NEXT_PUBLIC_CAMERA_STREAM_URL: ${{ secrets.NEXT_PUBLIC_CAMERA_STREAM_URL }}
          NEXT_PUBLIC_POCKETBASE_URL: ${{ secrets.NEXT_PUBLIC_POCKETBASE_URL }}
          NEXT_PUBLIC_PIN_CODE: ${{ secrets.NEXT_PUBLIC_PIN_CODE }}
        run: |
          echo "[BUILD DEBUG] ===== BUILD START ======"
          echo "[BUILD DEBUG] NEXT_PUBLIC_CAMERA_STREAM_URL length: ${#NEXT_PUBLIC_CAMERA_STREAM_URL}"
          echo "[BUILD DEBUG] NEXT_PUBLIC_POCKETBASE_URL length: ${#NEXT_PUBLIC_POCKETBASE_URL}"
          echo "[BUILD DEBUG] NEXT_PUBLIC_PIN_CODE length: ${#NEXT_PUBLIC_PIN_CODE}"
          echo "[BUILD DEBUG] All NEXT_PUBLIC_ vars:"
          env | grep NEXT_PUBLIC_ || echo "No NEXT_PUBLIC_ vars found!"
          echo "[BUILD DEBUG] Running npm run build..."
          npm run build 2>&1 | tee build.log
          echo "[BUILD DEBUG] Build log saved, checking for config debug output..."
          grep -i "NEXT CONFIG DEBUG" build.log || echo "No config debug output found"
          echo "[BUILD DEBUG] Checking if env vars are in built bundle..."
          find .next -name "*.js" -type f | head -5 | xargs grep -l "NEXT_PUBLIC_CAMERA_STREAM_URL" 2>/dev/null | head -1 | xargs grep -o "NEXT_PUBLIC_CAMERA_STREAM_URL[^\"']*" | head -1 || echo "Env var not found in bundle"
          echo "[BUILD DEBUG] Checking standalone output for env vars..."
          find .next/standalone -name "*.js" -type f 2>/dev/null | head -5 | while read file; do
            if grep -q "NEXT_PUBLIC_CAMERA_STREAM_URL" "$file" 2>/dev/null; then
              echo "[BUILD DEBUG] Found in: $file"
              grep -o "NEXT_PUBLIC_CAMERA_STREAM_URL[^\"']*" "$file" | head -1
            fi
          done || echo "No NEXT_PUBLIC vars found in standalone bundle"
          echo "[BUILD DEBUG] ===== BUILD COMPLETE ======"
          # Standalone output does not include public/ or static assets by default.
          # We manually copy them into the standalone folder to create a complete artifact.
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp -r pb_migrations .next/standalone/pb_migrations

      - name: Compress Artifact
        working-directory: portalweb
        # Tarballing makes the upload much faster than thousands of small files
        run: tar -czf release.tar.gz -C .next/standalone .

      - name: Prepare Files for Upload
        # Copy files to repo root so SCP uploads them without portalweb/ prefix
        run: |
          cp portalweb/release.tar.gz release.tar.gz
          cp portalweb/ecosystem.config.js ecosystem.config.js
          # Note: PocketBase binary is stored on the server and will be copied during deployment

      # --- TRANSFER PHASE ---
      - name: Upload to Server Cache
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          # We upload the app code and PM2 config (PocketBase binary is stored on server)
          source: "release.tar.gz,ecosystem.config.js"
          target: "/home/${{ secrets.USERNAME }}/deploy-cache/"

      # --- DEPLOY PHASE ---
      - name: Activate Release on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            # === VARIABLES ===
            APP_ROOT="/home/${{ secrets.USERNAME }}/web/portal.demotesting.co.uk"
            CACHE_DIR="/home/${{ secrets.USERNAME }}/deploy-cache"
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            NEW_RELEASE_DIR="$APP_ROOT/releases/$TIMESTAMP"
            
            # 1. Create directory & 2. Extract
            mkdir -p $NEW_RELEASE_DIR
            tar -xzf $CACHE_DIR/release.tar.gz -C $NEW_RELEASE_DIR
            
            # 2.1. Verify extraction
            if [ ! -f "$NEW_RELEASE_DIR/server.js" ]; then
              echo "ERROR: server.js not found in extracted release"
              exit 1
            fi
            
            # 3. Link Shared Resources
            ln -s $APP_ROOT/.env.production $NEW_RELEASE_DIR/.env
            ln -s $APP_ROOT/pb_data $NEW_RELEASE_DIR/pb_data
            
            # 4. Setup PocketBase
            # Copy PocketBase binary from persistent location on server
            POCKETBASE_BINARY="$APP_ROOT/pocketbase"
            POCKETBASE_DEST="$NEW_RELEASE_DIR/pocketbase"
            
            echo "===== POCKETBASE BINARY SETUP ====="
            echo "[DEBUG] Source path: $POCKETBASE_BINARY"
            echo "[DEBUG] Destination path: $POCKETBASE_DEST"
            echo "[DEBUG] Release directory: $NEW_RELEASE_DIR"
            
            # Check if source binary exists
            if [ ! -f "$POCKETBASE_BINARY" ]; then
              echo "ERROR: PocketBase binary not found at $POCKETBASE_BINARY"
              echo "[DEBUG] Listing parent directory contents:"
              ls -la "$APP_ROOT/" | grep -E "pocketbase|releases" || true
              echo "Please ensure the binary exists at the persistent location."
              exit 1
            fi
            
            # Check source file permissions and size
            echo "[DEBUG] Source binary info:"
            ls -lh "$POCKETBASE_BINARY" || true
            echo "[DEBUG] Source binary permissions: $(stat -c '%a %U:%G' "$POCKETBASE_BINARY" 2>/dev/null || echo 'stat failed')"
            echo "[DEBUG] Source binary size: $(stat -c '%s' "$POCKETBASE_BINARY" 2>/dev/null || echo 'unknown') bytes"
            
            # Check destination directory permissions
            echo "[DEBUG] Destination directory permissions: $(stat -c '%a %U:%G' "$NEW_RELEASE_DIR" 2>/dev/null || echo 'stat failed')"
            echo "[DEBUG] Current user: $(whoami)"
            echo "[DEBUG] Can write to destination? $(test -w "$NEW_RELEASE_DIR" && echo 'YES' || echo 'NO')"
            
            # Perform the copy with verbose output
            echo "[DEBUG] Attempting to copy binary..."
            if cp -v "$POCKETBASE_BINARY" "$POCKETBASE_DEST" 2>&1; then
              echo "[DEBUG] Copy command succeeded"
            else
              COPY_EXIT_CODE=$?
              echo "ERROR: Copy command failed with exit code $COPY_EXIT_CODE"
              echo "[DEBUG] Checking if destination file exists:"
              ls -la "$POCKETBASE_DEST" 2>&1 || echo "Destination file does not exist"
              exit 1
            fi
            
            # Verify the copy succeeded
            if [ ! -f "$POCKETBASE_DEST" ]; then
              echo "ERROR: Copy appeared to succeed but destination file not found!"
              echo "[DEBUG] Listing release directory contents:"
              ls -la "$NEW_RELEASE_DIR/" | head -20 || true
              exit 1
            fi
            
            # Check destination file size matches source
            SOURCE_SIZE=$(stat -c '%s' "$POCKETBASE_BINARY" 2>/dev/null || echo "0")
            DEST_SIZE=$(stat -c '%s' "$POCKETBASE_DEST" 2>/dev/null || echo "0")
            echo "[DEBUG] Source size: $SOURCE_SIZE bytes"
            echo "[DEBUG] Destination size: $DEST_SIZE bytes"
            
            if [ "$SOURCE_SIZE" != "$DEST_SIZE" ] || [ "$SOURCE_SIZE" = "0" ]; then
              echo "ERROR: File size mismatch! Source: $SOURCE_SIZE, Dest: $DEST_SIZE"
              exit 1
            fi
            
            # Set executable permissions
            echo "[DEBUG] Setting executable permissions..."
            if chmod +x "$POCKETBASE_DEST"; then
              echo "[DEBUG] Permissions set successfully"
              echo "[DEBUG] Final destination file info:"
              ls -lh "$POCKETBASE_DEST" || true
            else
              echo "ERROR: Failed to set executable permissions"
              exit 1
            fi
            
            # Verify executable bit is set
            if [ ! -x "$POCKETBASE_DEST" ]; then
              echo "ERROR: Executable bit not set after chmod!"
              echo "[DEBUG] File permissions: $(stat -c '%a' "$POCKETBASE_DEST" 2>/dev/null || echo 'unknown')"
              exit 1
            fi
            
            # Run migrations
            echo "[DEBUG] Running migrations..."
            cd $NEW_RELEASE_DIR
            if ./pocketbase migrate up 2>&1; then
              echo "✓ PocketBase binary copied and migrations run successfully"
            else
              MIGRATE_EXIT_CODE=$?
              echo "WARNING: Migrations exited with code $MIGRATE_EXIT_CODE"
              echo "Continuing deployment despite migration warning..."
            fi
            echo "===== POCKETBASE SETUP COMPLETE ====="
            
            # 5. Ecosystem & Timestamp File
            cp $CACHE_DIR/ecosystem.config.js $NEW_RELEASE_DIR/
            # Create a file we can read via API to verify version
            echo "$TIMESTAMP" > $NEW_RELEASE_DIR/.deployment-timestamp
            
            # 6. Zero-Downtime Switch
            if [ -L "$APP_ROOT/public_html" ]; then
              ln -sfn $NEW_RELEASE_DIR $APP_ROOT/public_html
            elif [ -d "$APP_ROOT/public_html" ]; then
              OLD_DIR="$APP_ROOT/public_html.old.$(date +%Y%m%d%H%M%S)"
              mv $APP_ROOT/public_html $OLD_DIR || true
              ln -sfn $NEW_RELEASE_DIR $APP_ROOT/public_html
            else
              ln -sfn $NEW_RELEASE_DIR $APP_ROOT/public_html
            fi
            
            # 6.1 Verify Symlink
            SYMLINK_TARGET=$(readlink -f $APP_ROOT/public_html)
            if [ "$SYMLINK_TARGET" != "$NEW_RELEASE_DIR" ]; then
              echo "ERROR: Symlink failed."
              exit 1
            fi
            
            # 7. Reload PM2 (SAFE MODE)
            cd $APP_ROOT/public_html
            echo "Restarting PM2..."
            
            # Stop and Delete specifically
            pm2 stop portal-web portal-pb || true
            sleep 2
            pm2 delete portal-web portal-pb || true
            sleep 1
            
            # Start fresh
            pm2 start ecosystem.config.js --update-env
            pm2 save
            
            # 7.1 Verify PM2 CWD
            sleep 3
            # We use a simple grep here. If it fails, we fail the deploy.
            # We do NOT use 'pm2 kill' to avoid killing invoice-server.
            PM2_INFO=$(pm2 describe portal-web 2>/dev/null)
            if [[ "$PM2_INFO" != *"$NEW_RELEASE_DIR"* ]]; then
               echo "WARNING: PM2 might still be running from old directory. Check manually."
               echo "Current PM2 Info for portal-web:"
               echo "$PM2_INFO" | grep "cwd"
               # We don't exit 1 here because grep output varies by PM2 version, 
               # and we don't want to break the pipeline if the logic is just fuzzy.
            else
               echo "✓ PM2 verified running from new release."
            fi
            
            # 7.2 Verify API (Wait for boot)
            echo "Waiting for Next.js to boot..."
            RETRIES=0
            # Wait up to 20 seconds
            until curl -s http://localhost:3005/api/deployment-status | grep "$TIMESTAMP" || [ $RETRIES -eq 10 ]; do
               sleep 2
               ((RETRIES++))
            done
            
            if [ $RETRIES -eq 10 ]; then
               echo "WARNING: Verification timed out. App might be slow to start or API route missing."
            else
               echo "✓ Code verification passed: API returned timestamp $TIMESTAMP"
            fi
            
            # 8. Cleanup
            cd $APP_ROOT/releases
            ls -dt * 2>/dev/null | tail -n +6 | xargs -I {} rm -rf {} || true
            rm -rf $CACHE_DIR/*
            
            echo "Deployment $TIMESTAMP Successful"
