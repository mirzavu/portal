services:
  app:
    image: ${DOCKER_HUB_REPO}:portal-frontend
    restart: always
    ports:
      - "3005:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - POCKETBASE_URL=http://pocketbase:8090
    depends_on:
      - pocketbase

  pocketbase:
    image: ${DOCKER_HUB_REPO}:portal-pocketbase
    restart: always
    ports:
      - "8095:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
